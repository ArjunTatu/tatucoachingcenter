<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TATU Coaching Center</title>
<link rel="icon" type="image" href="Civil.jpg">

<style>
/* ---------------- BODY ---------------- */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  color: #00ffcc;
}

/* ---------------- PARTICLE CANVAS ---------------- */
#particleCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1; /* behind everything */
  background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ---------------- HEADER ---------------- */
header {
  width: 100%;
  padding: 15px 30px;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: fixed;
  top: 0;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  z-index: 10;
}

header h1 {
  margin: 10;
  font-size: 28px;
  text-align: center;
  letter-spacing: 2px;
  color: #ffffff;
  text-shadow: 0 0 5px #000000; /* decreased glow */
}

.top-bar {
  align-items: center;
  gap: 12px;
}

.logout-btn {
  padding: 10px 22px;
  background: #00ffcc;
  color: #000;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s;
}

.logout-btn:hover {
  background: #00cc99;
  transform: scale(1.05);
}

/* ---------------- MENU ---------------- */
.menu {
  display: flex;
  gap: 40px; /* increased spacing */
  margin-top: 160px;
  flex-wrap: wrap;
  justify-content: center;
  z-index: 1;
}

/* ---------------- GLASS BUTTONS ---------------- */
.box {
  padding: 35px 80px; /* increased size */
  background: rgba(0, 0, 0, 0.25);
  border-radius: 18px;
  border: 2px solid rgba(0, 255, 204, 0.3); /* decreased glow */
  font-size: 28px; /* larger text */
  font-weight: bold;
  color: #00ffcc;
  text-decoration: none;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 0 6px rgba(0,255,204,0.2); /* decreased glow */
}

.box:hover {
  background: rgba(0, 255, 204, 0.08);
  color: #ffffff;
  border-color: #00ffcc;
  transform: scale(1.08);
  box-shadow: 0 0 12px #00ffcc; /* subtle hover glow */
}

/* ---------------- FOOTER ---------------- */
footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 12px;
  text-align: center;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  border-top: 1px solid rgba(255,255,255,0.2);
  font-size: 14px;
  letter-spacing: 1px;
  color: #00ffcc;
  text-shadow: 0 0 3px #00ffcc; /* decreased glow */
  z-index: 1;
}

/* ---------------- RESPONSIVE ---------------- */
@media (max-width: 600px) {
  .menu {
    flex-direction: column;
    gap: 25px;
  }
  .box {
    padding: 25px 60px;
    font-size: 24px;
  }
}
</style>
</head>

<body>

<canvas id="particleCanvas"></canvas>

<header>
  <h1>Center</h1>
  <div class="top-bar">
    <span id="usernameDisplay"></span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>

<div class="menu">
  <a href="se.html" class="box">SE</a>
  <a href="te.html" class="box">TE</a>
  <button class="box" onclick="toggleBEPage()">BE</button>
</div>

<footer>
  Welcome to Club Bro
</footer>

<script>
// ---------------- LOGIN CHECK ----------------
const user = localStorage.getItem("loggedInUser");
const loginTime = localStorage.getItem("loginTime");
const now = new Date().getTime();

if (!user || !loginTime || (now - loginTime > 24 * 60 * 60 * 1000)) {
  localStorage.removeItem("loggedInUser");
  localStorage.removeItem("loginTime");
  window.location.href = "index.html";
} else {
  document.getElementById("usernameDisplay").textContent = `Logged in as: ${user}`;
}

function logout() {
  localStorage.removeItem("loggedInUser");
  localStorage.removeItem("loginTime");
  window.location.href = "index.html";
}

// ---------------- BE BUTTON TOGGLE ----------------
function toggleBEPage() {
  const lastPage = localStorage.getItem("lastBEPage");
  const nextPage = (!lastPage || lastPage === "be.html") ? "be2.html" : "be.html";
  localStorage.setItem("lastBEPage", nextPage);
  window.location.href = nextPage;
}

// ---------------- PARTICLE ANIMATION ----------------
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];
const particleCount = 80;

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 3 + 1;
    this.speedX = (Math.random() - 0.5) * 1.5;
    this.speedY = (Math.random() - 0.5) * 1.5;
    this.color = "rgba(0,255,204,0.4)"; // subtle color
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;

    if (this.x > canvas.width) this.x = 0;
    if (this.x < 0) this.x = canvas.width;
    if (this.y > canvas.height) this.y = 0;
    if (this.y < 0) this.y = canvas.height;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
}

function initParticles() {
  particlesArray = [];
  for (let i = 0; i < particleCount; i++) {
    particlesArray.push(new Particle());
  }
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particlesArray.forEach(p => {
    p.update();
    p.draw();
  });
  requestAnimationFrame(animateParticles);
}

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initParticles();
});

initParticles();
animateParticles();
</script>

</body>
</html>
